<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>到点提醒 · 看板卡片</title>
<style>
  :root {
    --bg: #ffffff;
    --surface-2: #eef1f5;
    --line: #dfe4ea;
    --ink: #23272e;
    --ink-muted: #6b7480;
    --ink-faint: #97a0ab;
    --accent: #3f6fa8;
    --accent-hover: #35608f;
    --accent-soft: #e8f0f8;
    --success: #3f7a55;
    --success-soft: #e6f1ea;
    --danger: #a8503f;
    --danger-soft: #f7e9e5;
    --warning: #9a6b28;
    --warning-soft: #f6efdf;
    --radius: 10px;
    --radius-sm: 7px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.5;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }

  .icon {
    width: 15px;
    height: 15px;
    flex: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 0;
  }
  .head .mark {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .head b { font-size: 12.5px; font-weight: 600; }
  .head .spacer { flex: 1; }
  .head .sum { color: var(--ink-faint); font-size: 11px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 12px 0;
  }
  .stat {
    border-radius: var(--radius);
    padding: 8px 10px;
    background: var(--surface-2);
  }
  .stat b { display: block; font-size: 17px; line-height: 1.25; }
  .stat span { font-size: 11px; color: var(--ink-muted); }
  .stat.pending b { color: var(--accent); }
  .stat.today b { color: var(--warning); }
  .stat.overdue b { color: var(--danger); }
  .stat.overdue.hot { background: var(--danger-soft); }

  .next {
    margin: 10px 12px 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
  }
  .next .label { font-size: 11px; color: var(--ink-faint); }
  .next .text { word-break: break-word; }
  .next .when { font-size: 11px; color: var(--warning); }
  .next .when.past { color: var(--danger); font-weight: 600; }

  .quick {
    display: flex;
    gap: 6px;
    padding: 10px 12px 12px;
  }
  .quick input {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  .quick input:focus { border-color: var(--accent); }
  .quick button {
    height: 30px;
    padding: 0 12px;
    border-radius: 15px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
  }
  .quick button:hover { background: var(--accent-hover); }
</style>
</head>
<body>

<div class="head">
  <div class="mark">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </div>
  <b>到点提醒</b>
  <div class="spacer"></div>
  <span class="sum" id="sum">--</span>
</div>

<div class="stats">
  <div class="stat pending"><b id="st-pending">-</b><span>待办</span></div>
  <div class="stat today"><b id="st-today">-</b><span>今天到期</span></div>
  <div class="stat overdue" id="st-overdue-box"><b id="st-overdue">-</b><span>已逾期</span></div>
</div>

<div class="next" id="next-box" style="display:none">
  <div class="label">最近到期</div>
  <div class="text" id="next-text"></div>
  <div class="when" id="next-when"></div>
</div>

<form class="quick" id="quick-form">
  <input id="quick-input" type="text" maxlength="200" placeholder="快速添加一条待办…" autocomplete="off" />
  <button type="submit">添加</button>
</form>

<script>
(function () {
  'use strict';

  var TODO_KEY = 'todos';
  var CHANGED_EVENT = 'todo-reminder:changed';
  var MAX_TODOS = 200;   // 与常驻层/面板同一容量上限：满时明确拒绝，不静默丢数据

  var $ = function (id) { return document.getElementById(id); };
  var todos = [];

  function loadTodos() {
    return pet.storage.get(TODO_KEY, []).then(function (raw) {
      todos = Array.isArray(raw) ? raw.filter(function (t) { return t && typeof t.text === 'string'; }) : [];
      render();
    });
  }

  function saveTodos() {
    return pet.storage.set(TODO_KEY, todos).then(function () {
      render();
      return pet.events.emit(CHANGED_EVENT, { scope: 'todo' }).catch(function () {});
    });
  }

  function formatWhen(due) {
    var at = Date.parse(due);
    if (Number.isNaN(at)) return '';
    var d = new Date(at);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var clock = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return (sameDay ? '今天 ' : (d.getMonth() + 1) + '月' + d.getDate() + '日 ') + clock;
  }

  function render() {
    var now = Date.now();
    var pending = todos.filter(function (t) { return !t.done; });
    var done = todos.filter(function (t) { return t.done; });
    var today = pending.filter(function (t) {
      if (!t.due) return false;
      var d = new Date(Date.parse(t.due));
      var n = new Date();
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    });
    var overdue = pending.filter(function (t) { return t.due && Date.parse(t.due) < now; });

    $('st-pending').textContent = String(pending.length);
    $('st-today').textContent = String(today.length);
    $('st-overdue').textContent = String(overdue.length);
    $('st-overdue-box').className = 'stat overdue' + (overdue.length ? ' hot' : '');
    $('sum').textContent = '完成 ' + done.length;

    // 最近到期：未完成 + 有到期时间，时间最早的一条。
    var next = pending
      .filter(function (t) { return t.due && !Number.isNaN(Date.parse(t.due)); })
      .sort(function (a, b) { return Date.parse(a.due) - Date.parse(b.due); })[0];

    if (next) {
      $('next-box').style.display = '';
      $('next-text').textContent = next.text;
      var when = $('next-when');
      var isPast = Date.parse(next.due) < now;
      when.className = 'when' + (isPast ? ' past' : '');
      when.textContent = formatWhen(next.due) + (isPast ? ' · 已逾期' : '');
    } else {
      $('next-box').style.display = 'none';
    }

    // 高度按内容自适应后通知宿主。
    if (pet.dashboard && pet.dashboard.requestHeight) {
      pet.dashboard.requestHeight(document.body.scrollHeight).catch(function () {});
    }
    if (pet.dashboard && pet.dashboard.notifyReady) {
      pet.dashboard.notifyReady().catch(function () {});
    }
  }

  $('quick-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('quick-input');
    var text = input.value.trim();
    if (!text) return;
    if (todos.length >= MAX_TODOS) {
      // 容量已满：明确告知（卡片没有 toast，走宿主风格对话框），不写入、不假成功。
      try {
        pet.ui.dialog({
          title: '容量已满',
          text: '待办已达上限 ' + MAX_TODOS + ' 条，先到面板完成或删除一些再添加。',
          okLabel: '知道了',
          cancelLabel: ' '
        }).catch(function () {});
      } catch (err) { /* 旧宿主不支持对话框时忽略，数据保持原样 */ }
      return;
    }
    todos.push({
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: text,
      done: false,
      due: '',
      remindedAt: 0,
      nagCount: 0,
      ts: Date.now()
    });
    input.value = '';
    saveTodos();
  });

  if (pet.events && pet.events.on) {
    pet.events.on(CHANGED_EVENT, function () {
      loadTodos().catch(function () {});
    });
  }

  loadTodos().catch(function () {
    // 卡片初始化失败时保持占位，不阻塞看板其它卡片。
  });
})();
</script>
</body>
</html>
